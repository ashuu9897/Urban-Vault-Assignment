[project]
name = "facility-helpdesk-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["helpdesk/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "C4", "RUF"]
# Django declares Meta options, admin options and DRF attributes as class-level lists.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"helpdesk/tests/*" = ["DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
