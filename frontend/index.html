<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- UV brand mark. "?v=2" makes browsers drop the previously cached icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Facility Helpdesk – raise, assign and resolve facility tickets."
    />
    <title>Facility Helpdesk</title>
    <style>
      html {
        background: #f5f6fa;
      }
      html[data-mui-color-scheme='dark'] {
        background: #0e1117;
        color-scheme: dark;
      }
    </style>
    <script>
      // Apply the stored (or OS) colour scheme before React mounts so dark-mode users never see
      // a white flash. Mirrors MUI's InitColorSchemeScript (same storage key and attribute).
      (function () {
        var mode = 'system';
        try {
          mode = localStorage.getItem('mui-mode') || 'system';
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-mui-color-scheme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
